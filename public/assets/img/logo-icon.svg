<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C170" />
      <stop offset="50%" stop-color="#C69C4E" />
      <stop offset="100%" stop-color="#9E7728" />
    </linearGradient>
  </defs>
  <g transform="translate(50, 50) scale(0.28)">
    <!-- Outer Diamond Frame -->
    <path d="M 0 -140 L 140 0 L 0 140 L -140 0 Z" fill="none" stroke="url(#goldGradIcon)" stroke-width="10" opacity="0.3" />
    <!-- Roof Peak -->
    <path d="M -110 35 L 0 -95 L 110 35" fill="none" stroke="url(#goldGradIcon)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pillars -->
    <path d="M -65 35 L -65 110 M -65 -10 L 0 -10 L 0 35" fill="none" stroke="url(#goldGradIcon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 65 35 L 65 110 M 0 -10 L 65 35 L 65 110" fill="none" stroke="url(#goldGradIcon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Apex Accent -->
    <polygon points="0,-125 10,-105 0,-85 -10,-105" fill="url(#goldGradIcon)" />
  </g>
</svg>
